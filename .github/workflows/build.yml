name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:        # ad-hoc signed build, no notarization
    inputs:
      release:
        description: 'Existing release tag (e.g. v1.4.0): rebuild from that tag and replace its files'
        required: false
        default: ''

permissions:
  contents: write   # create a Release on tags

# Release builds (tag push) are signed with Developer ID, notarized and stapled.
# Secrets: DEVELOPER_ID_CERT_P12_BASE64, DEVELOPER_ID_CERT_PASSWORD, AC_API_KEY_ID,
#   AC_API_ISSUER_ID, AC_API_KEY_P8_BASE64, SPARKLE_ED_PRIVATE_KEY, TAP_DEPLOY_KEY.
# Variables: HEALTHBAR_BUNDLE_ID, HEALTHBAR_DISPLAY_NAME, HEALTHBAR_REPO_SLUG,
#   HEALTHBAR_FEED_URL, HEALTHBAR_SU_PUBLIC_KEY, HEALTHBAR_TAP_REPO. See docs/RELEASING.md.

env:
  TAG: ${{ inputs.release || github.ref_name }}
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release != '' }}

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: swiftc --version && sw_vers
      - run: ./scripts/run-tests.sh

  build:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release || github.ref }}
          fetch-depth: 0          # build number = commit count
          persist-credentials: false   # steps pass the token explicitly

      - name: Import Developer ID certificate (release only)
        if: env.RELEASE == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/healthbar.keychain-db"
          KP="$(uuidgen)"   # ephemeral keychain password
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN" >/dev/null
          HASH="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          echo "::add-mask::$HASH"
          echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build
        env:
          # always the release-named HealthBar.app, so packaging finds dist/HealthBar.app
          HEALTHBAR_RELEASE: '1'
          WITH_SPARKLE: ${{ env.RELEASE == 'true' && '1' || '0' }}
          HEALTHBAR_BUNDLE_ID: ${{ vars.HEALTHBAR_BUNDLE_ID }}
          HEALTHBAR_DISPLAY_NAME: ${{ vars.HEALTHBAR_DISPLAY_NAME }}
          HEALTHBAR_REPO_SLUG: ${{ vars.HEALTHBAR_REPO_SLUG || github.repository }}
          HEALTHBAR_FEED_URL: ${{ vars.HEALTHBAR_FEED_URL }}
          HEALTHBAR_SU_PUBLIC_KEY: ${{ vars.HEALTHBAR_SU_PUBLIC_KEY }}
        run: ./scripts/build.sh            # signs with $SIGN_IDENTITY if set, else ad-hoc

      - name: Notarize + staple app (release only)
        if: env.RELEASE == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/ac.p8"
          export AC_API_KEY_PATH="$RUNNER_TEMP/ac.p8"
          ditto -c -k --keepParent dist/HealthBar.app "$RUNNER_TEMP/notarize.zip"
          ./scripts/notarize.sh "$RUNNER_TEMP/notarize.zip" dist/HealthBar.app
          rm -f "$RUNNER_TEMP/ac.p8"

      - name: Package (zip + dmg)
        run: |
          set -euo pipefail
          ditto -c -k --keepParent dist/HealthBar.app dist/HealthBar.zip   # contains the stapled app
          ./scripts/make-dmg.sh

      - name: Notarize + staple DMG (release only)
        if: env.RELEASE == 'true'
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$AC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/ac.p8"
          export AC_API_KEY_PATH="$RUNNER_TEMP/ac.p8"
          ./scripts/notarize.sh dist/HealthBar.dmg
          rm -f "$RUNNER_TEMP/ac.p8"

      - name: Upload distributables (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: healthbar-dist
          path: |
            dist/HealthBar.dmg
            dist/HealthBar.zip
          if-no-files-found: error

      - name: Release (on tag)
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/release-notes/${TAG}.md"
          # a re-run of a tag push finds its release already created
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            [ -f "$NOTES" ] && NOTES_ARG=(--notes-file "$NOTES") || NOTES_ARG=()
            gh release create "$TAG" dist/HealthBar.dmg dist/HealthBar.zip \
              --title "$TAG" --generate-notes "${NOTES_ARG[@]}"
          else
            gh release upload "$TAG" dist/HealthBar.dmg dist/HealthBar.zip --clobber
          fi

      - name: Latest release? (the appcast and the cask follow only the latest)
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          echo "LATEST=$([ "$LATEST" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_ENV"
          [ "$LATEST" = "$TAG" ] || echo "::notice::$TAG is not the latest release ($LATEST): appcast and cask left alone"

      - name: Publish Sparkle appcast to gh-pages (release only)
        if: env.RELEASE == 'true' && env.LATEST == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY unset — a release without its appcast entry never reaches installed copies"; exit 1
          fi
          GEN="$(ls .sparkle/*/bin/generate_appcast | head -1)"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/ed_priv"
          SRC="$RUNNER_TEMP/appcast-src"; mkdir -p "$SRC"; cp dist/HealthBar.zip "$SRC/"
          # generate_appcast embeds a body-less .html sibling of the archive as the item <description>
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh api --method POST /markdown -f mode=gfm \
              -f "text=$(cat "$NOTES")" > "$SRC/HealthBar.html"
          else
            echo "no $NOTES — appcast item will have no release notes"
          fi
          "$GEN" --ed-key-file "$RUNNER_TEMP/ed_priv" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            "$SRC"
          rm -f "$RUNNER_TEMP/ed_priv"
          OUT="$RUNNER_TEMP/pages"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$OUT" 2>/dev/null || {
              git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$OUT"
              ( cd "$OUT" && git checkout --orphan gh-pages && git rm -rf . >/dev/null 2>&1 || true )
            }
          cp "$SRC/appcast.xml" "$OUT/appcast.xml"
          ( cd "$OUT"
            git add appcast.xml
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "appcast ${TAG}" || { echo "no change"; exit 0; }
            git push origin gh-pages )

      - name: Check the feed serves this release (release only)
        if: env.RELEASE == 'true' && env.LATEST == 'true'
        env:
          FEED_URL: ${{ vars.HEALTHBAR_FEED_URL }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 20 "${FEED_URL}?ci=${GITHUB_RUN_ID}-${i}" \
                | grep -q "<sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"; then
              echo "feed serves ${VERSION}"; exit 0
            fi
            sleep 15
          done
          echo "::error::${FEED_URL} does not list ${VERSION} after 10 minutes"; exit 1

      - name: Update Homebrew tap (release only)
        if: env.RELEASE == 'true' && env.LATEST == 'true'
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          HEALTHBAR_TAP_REPO: ${{ vars.HEALTHBAR_TAP_REPO }}
          HEALTHBAR_REPO_SLUG: ${{ vars.HEALTHBAR_REPO_SLUG || github.repository }}
          HEALTHBAR_BUNDLE_ID: ${{ vars.HEALTHBAR_BUNDLE_ID }}
        run: ./packaging/homebrew/update-cask.sh "${TAG#v}" dist/HealthBar.dmg
